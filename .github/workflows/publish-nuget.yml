name: Publish to NuGet

on:
  push:
    branches: [main]

jobs:
  publish:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: LiteBase/ui/pnpm-lock.yaml

      - name: Build UI
        working-directory: LiteBase/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Bump patch version
        id: version
        run: |
          CURRENT=$(grep -oP '(?<=<Version>)[^<]+' LiteBase/LiteBase.csproj)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s|<Version>.*</Version>|<Version>$NEW</Version>|" LiteBase/LiteBase.csproj
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped version: $CURRENT -> $NEW"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack .NET project
        run: dotnet pack LiteBase/LiteBase.csproj -c Release -o ./artifacts

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Commit version bump and tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LiteBase/LiteBase.csproj
          git commit -m "chore: release v${{ steps.version.outputs.new_version }} [skip ci]"
          git tag "v${{ steps.version.outputs.new_version }}"
          git push
          git push origin "v${{ steps.version.outputs.new_version }}"
